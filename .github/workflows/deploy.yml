name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_WS_HOST: ${{ vars.VITE_WS_HOST || secrets.VITE_WS_HOST }}
          VITE_WS_PORT: ${{ vars.VITE_WS_PORT || secrets.VITE_WS_PORT }}
          VITE_WS_PROTOCOL: ${{ vars.VITE_WS_PROTOCOL || secrets.VITE_WS_PROTOCOL }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL || secrets.VITE_WS_URL }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
